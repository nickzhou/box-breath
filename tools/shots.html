<!doctype html>
<!-- Store screenshot frame. Usage: shots.html?shot=in&cap=Follow%20the%20square -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #7fe0c7; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  h1 { color: #06231f; font-size: 8.4vw; line-height: 1.12; text-align: center; margin: 0; padding: 7vh 6vw 3.5vh; font-weight: 800; letter-spacing: -.01em; }
  iframe { flex: 1; width: 84vw; border: 0; border-radius: 7vw 7vw 0 0; box-shadow: 0 2vh 6vh rgba(0,0,0,.35); background: #0e2a3b; }
  body.wide h1 { font-size: 5.4vw; padding: 5vh 6vw 3vh; } body.wide iframe { width: 78vw; border-radius: 4vw 4vw 0 0; }
</style></head><body>
<h1 id="cap"></h1><iframe id="f" title="app"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('cap').textContent = q.get('cap') || '';
  if (innerWidth > 700) document.body.classList.add('wide');
  document.getElementById('f').src = 'app/?shot=' + (q.get('shot') || 'home');
</script></body></html>
